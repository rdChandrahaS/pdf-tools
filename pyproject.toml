[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-tools"
version = "0.3.0"
description = "Offline command-line PDF and image toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "questionary>=2.1.1",
    "tqdm>=4.70.0",
]

[project.scripts]
pdf-tools = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
